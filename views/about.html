<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{aboutTitle}} · {{nickname}}</title>
  <meta name="description" content="{{aboutDesc}}">
  <meta name="theme-color" content="#F6F1E8">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('xc-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    })();
  </script>
  <link rel="icon" href="{{favicon}}" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="{{touchIcon}}">
  <link rel="stylesheet" href="assets/css/style.css?v={{assetVersion}}">
  <noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <nav class="nav" id="site-nav" aria-label="主导航">
        <a href="index.html" data-nav="index">首页</a>
        <a href="about.html" data-nav="about">关于我</a>
        <a href="guestbook.html" data-nav="guestbook">留言板</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="打开菜单" aria-controls="site-nav" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container page">
    <header class="page-head reveal">
      <p class="eyebrow">{{aboutKicker}}</p>
      <h1 class="page-title">{{aboutTitle}}</h1>
      <p class="page-desc">{{aboutDesc}}</p>
    </header>

    <div class="prose reveal">
      {{aboutParagraphs}}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{icp}}</p>
    </div>
  </footer>

  <script src="assets/js/site.js?v={{assetVersion}}"></script>
</body>
</html>
