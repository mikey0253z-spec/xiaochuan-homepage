<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="小川的头像占位图">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e5d5"/>
      <stop offset="1" stop-color="#e3cbb2"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#avatar-bg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fffdf8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" dominant-baseline="central" dy="4"
        font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif"
        font-size="86" font-weight="600" fill="#8f5b3a">川</text>
</svg>
